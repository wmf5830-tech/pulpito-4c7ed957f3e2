<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E56425">
<title>Púlpito · Meus Esboços</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --o:#E56425;--o6:#C9531B;--o7:#A8430F;--o50:#FDEDE3;--o100:#FBD7C3;
  --g:#005924;--g50:#E6F4EC;
  --bg:#F5F5F6;--card:#fff;--b1:#DDDDE0;--b2:#ECECEE;--t1:#19191B;--t2:#3E3E43;--t3:#74747B;
  --danger:#C8362D;--r:8px;--rl:10px;
  --font:"Montserrat","Inter","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:15px;line-height:1.5}
#app{max-width:720px;margin:0 auto;min-height:100%;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--b1);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:28px;height:28px;border-radius:50%;background:var(--o);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
main{padding:14px 16px}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
.btn{border:1px solid var(--b1);background:var(--card);border-radius:var(--r);padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn.p{background:var(--o);border-color:var(--o);color:#fff}
.btn.p:active{background:var(--o7)}
.btn.s{padding:6px 10px;min-height:32px;font-size:13px}
.btn.d{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--o7)}
input[type=text],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;border:1px solid var(--b1);border-radius:var(--r);padding:10px 12px;background:#fff;min-height:42px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--o);outline-offset:-1px;border-color:var(--o)}
label{display:block;font-size:12px;font-weight:600;color:var(--t3);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--b1);border-radius:var(--rl);padding:14px;margin-bottom:10px}
.card.click{cursor:pointer}
.card h3{margin:0 0 4px;font-size:16px}
.muted{color:var(--t3);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--b1);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--t2)}
.chip.on{background:var(--o50);border-color:var(--o);color:var(--o7)}
.tag{display:inline-block;background:var(--o50);color:var(--o7);border-radius:4px;padding:2px 7px;font-size:11px;font-weight:600;margin:2px 4px 2px 0}
.tag.g{background:var(--g50);color:var(--g)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:0 0 auto}.row>.grow{flex:1 1 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--b1);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 9px;font-size:11px;font-weight:600;color:var(--t3);cursor:pointer}
nav.tabs button.on{color:var(--o)}
nav.tabs button b{display:block;font-size:18px;line-height:1.2}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;width:54px;height:54px;border-radius:50%;background:var(--o);color:#fff;border:0;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
/* tópicos expansíveis */
.topic{background:var(--card);border:1px solid var(--b1);border-radius:var(--rl);margin-bottom:8px;overflow:hidden}
.topic>button.th{width:100%;text-align:left;border:0;background:none;padding:13px 14px;display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer;font-size:inherit}
.topic .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--o);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.topic .tt{flex:1}
.topic .car{transition:transform .15s;color:var(--t3)}
.topic.open .car{transform:rotate(90deg)}
.topic .tb{display:none;padding:0 14px 14px 50px;color:var(--t2);word-wrap:break-word;line-height:1.7}
.tb p{margin:0 0 .85em}.tb ul,.tb ol{margin:0 0 .85em;padding-left:1.3em}.tb li{margin-bottom:.4em}.tb b{color:var(--t1);font-weight:700}.tb u{text-decoration-thickness:2px;text-underline-offset:3px}
.fmtbar{display:flex;gap:6px;margin:6px 0}.fmtbar .btn{min-width:42px}
.topic.open .tb{display:block}
a.ref,.ref{color:var(--o7);font-weight:600;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(25,25,27,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:720px;max-height:88vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
.sheet header{padding:14px 16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:8px}
.sheet header h2{margin:0;font-size:16px;flex:1}
.sheet .body{padding:14px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto}
.verse{margin:0 0 8px}
.verse sup{color:var(--o);font-weight:700;margin-right:4px;font-size:11px}
.verse.hl{background:var(--o50);border-radius:4px;padding:2px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.grid button{padding:10px 4px}
.sect{font-size:12px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
/* modo pregação */
body.preach{background:#fff}
.preach-bar{position:sticky;top:0;z-index:5;background:var(--t1);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.pb{display:flex;gap:8px;align-items:center}.pb+.pb{margin-top:6px}
.clk,.tmr{font-weight:700;font-variant-numeric:tabular-nums;font-size:18px}.tmr{color:#FBD7C3}
.preach-bar .btn{background:#2c2c30;border-color:#3e3e43;color:#fff;min-height:36px;padding:6px 10px;font-size:13px}
.preach-bar .grow{flex:1;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pm .topic .th{font-size:inherit}
.pm .topic .tb{font-size:inherit}
.empty{text-align:center;color:var(--t3);padding:36px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--t1);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:30}
.note{background:var(--g50);border:1px solid #B8DEC8;border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--g)}
.warn{background:#FBF1D9;border:1px solid #F0D58A;border-radius:var(--r);padding:10px 12px;font-size:13px;color:#7a5600}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ===================== LIVROS ===================== */
const BOOKS=[
["Gênesis","Gn","GEN",50,["genesis","gn","gen"]],["Êxodo","Êx","EXO",40,["exodo","ex","exo"]],["Levítico","Lv","LEV",27,["levitico","lv","lev"]],["Números","Nm","NUM",36,["numeros","nm","num"]],["Deuteronômio","Dt","DEU",34,["deuteronomio","dt","deut"]],
["Josué","Js","JOS",24,["josue","js","jos"]],["Juízes","Jz","JDG",21,["juizes","jz","jui"]],["Rute","Rt","RUT",4,["rute","rt"]],["1 Samuel","1Sm","1SA",31,["1samuel","1sm","1sam"]],["2 Samuel","2Sm","2SA",24,["2samuel","2sm","2sam"]],
["1 Reis","1Rs","1KI",22,["1reis","1rs"]],["2 Reis","2Rs","2KI",25,["2reis","2rs"]],["1 Crônicas","1Cr","1CH",29,["1cronicas","1cr"]],["2 Crônicas","2Cr","2CH",36,["2cronicas","2cr"]],["Esdras","Ed","EZR",10,["esdras","ed","esd"]],
["Neemias","Ne","NEH",13,["neemias","ne"]],["Ester","Et","EST",10,["ester","et","est"]],["Jó","Jó","JOB",42,["jo","job"]],["Salmos","Sl","PSA",150,["salmos","salmo","sl"]],["Provérbios","Pv","PRO",31,["proverbios","pv","prov"]],
["Eclesiastes","Ec","ECC",12,["eclesiastes","ec","ecl"]],["Cantares","Ct","SNG",8,["cantares","ct","cantico","canticos"]],["Isaías","Is","ISA",66,["isaias","is"]],["Jeremias","Jr","JER",52,["jeremias","jr"]],["Lamentações","Lm","LAM",5,["lamentacoes","lm","lam"]],
["Ezequiel","Ez","EZK",48,["ezequiel","ez","eze"]],["Daniel","Dn","DAN",12,["daniel","dn","dan"]],["Oseias","Os","HOS",14,["oseias","os"]],["Joel","Jl","JOL",3,["joel","jl"]],["Amós","Am","AMO",9,["amos","am"]],
["Obadias","Ob","OBA",1,["obadias","ob","abdias"]],["Jonas","Jn","JON",4,["jonas","jn"]],["Miqueias","Mq","MIC",7,["miqueias","mq","miq"]],["Naum","Na","NAM",3,["naum","na"]],["Habacuque","Hc","HAB",3,["habacuque","hc","hab"]],
["Sofonias","Sf","ZEP",3,["sofonias","sf"]],["Ageu","Ag","HAG",2,["ageu","ag"]],["Zacarias","Zc","ZEC",14,["zacarias","zc","zac"]],["Malaquias","Ml","MAL",4,["malaquias","ml","mal"]],
["Mateus","Mt","MAT",28,["mateus","mt","mat"]],["Marcos","Mc","MRK",16,["marcos","mc","mar"]],["Lucas","Lc","LUK",24,["lucas","lc","luc"]],["João","Jo","JHN",21,["joao","jo"]],["Atos","At","ACT",28,["atos","at"]],
["Romanos","Rm","ROM",16,["romanos","rm","rom"]],["1 Coríntios","1Co","1CO",16,["1corintios","1co","1cor"]],["2 Coríntios","2Co","2CO",13,["2corintios","2co","2cor"]],["Gálatas","Gl","GAL",6,["galatas","gl","gal"]],["Efésios","Ef","EPH",6,["efesios","ef","efe"]],
["Filipenses","Fp","PHP",4,["filipenses","fp","fil"]],["Colossenses","Cl","COL",4,["colossenses","cl","col"]],["1 Tessalonicenses","1Ts","1TH",5,["1tessalonicenses","1ts","1tes"]],["2 Tessalonicenses","2Ts","2TH",3,["2tessalonicenses","2ts","2tes"]],
["1 Timóteo","1Tm","1TI",6,["1timoteo","1tm","1tim"]],["2 Timóteo","2Tm","2TI",4,["2timoteo","2tm","2tim"]],["Tito","Tt","TIT",3,["tito","tt"]],["Filemom","Fm","PHM",1,["filemom","fm","filemon"]],
["Hebreus","Hb","HEB",13,["hebreus","hb","heb"]],["Tiago","Tg","JAS",5,["tiago","tg"]],["1 Pedro","1Pe","1PE",5,["1pedro","1pe","1ped"]],["2 Pedro","2Pe","2PE",3,["2pedro","2pe","2ped"]],
["1 João","1Jo","1JN",5,["1joao","1jo"]],["2 João","2Jo","2JN",1,["2joao","2jo"]],["3 João","3Jo","3JN",1,["3joao","3jo"]],["Judas","Jd","JUD",1,["judas","jd"]],["Apocalipse","Ap","REV",22,["apocalipse","ap","apoc"]]
];
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[.\s]/g,"");
const ALIAS={};BOOKS.forEach((b,i)=>{[b[0],b[1],b[2],...b[4]].forEach(a=>{const k=norm(a);if(!(k in ALIAS))ALIAS[k]=i;});});
ALIAS["jo"]=42; // "Jo" = João; "Jó" (com acento) tratado à parte
const isJo=t=>/^[jJ][óÓ]$/.test(String(t).trim());
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const FACETS=[["tema","Tema"],["publico","Público"],["assunto","Assunto"],["livro","Livro"],["personagem","Personagem"]];

/* ===================== ARMAZENAMENTO (IndexedDB, só no aparelho) ===================== */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open("pulpito",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>{this.db=r.result;res();};r.onerror=()=>rej(r.error);});},
 get(k){return new Promise(res=>{const q=this.db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);});},
 set(k,v){return new Promise((res,rej)=>{const t=this.db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
};
let S={sermons:[],agenda:[],settings:{fs:17}},BIBLE=null;
const save=()=>DB.set("data",S);

/* ===================== REFERÊNCIAS BÍBLICAS ===================== */
const REF_RE=/(?<![A-Za-zÀ-ú0-9])((?:[1-3]\s?)?[A-Za-zÀ-ú]{1,14})\.?\s*(\d{1,3})(?:\s*[:.,]\s*(\d{1,3})(?:\s*[-–]\s*(\d{1,3}))?)?/g;
function parseRefs(text){const out=[];let m;REF_RE.lastIndex=0;
 while((m=REF_RE.exec(text))){const bi=isJo(m[1])?17:ALIAS[norm(m[1])];if(bi===undefined){REF_RE.lastIndex=m.index+1;continue;}
  const ch=+m[2];if(ch<1||ch>BOOKS[bi][3])continue;
  out.push({i:m.index,len:m[0].length,b:bi,c:ch,v1:m[3]?+m[3]:null,v2:m[4]?+m[4]:(m[3]?+m[3]:null)});}
 return out;}
function linkify(text){const refs=parseRefs(text||"");let o="",p=0;
 for(const r of refs){o+=esc(text.slice(p,r.i));
  o+=`<span class="ref" data-act="ref" data-b="${r.b}" data-c="${r.c}" data-v1="${r.v1||""}" data-v2="${r.v2||""}">${esc(text.substr(r.i,r.len))}</span>`;p=r.i+r.len;}
 return o+esc(text.slice(p));}

const inl=h=>h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/__(.+?)__/g,"<u>$1</u>");
function fmt(text){
 if(!text)return"";let out="",list=null,para=[];
 const fp=()=>{if(para.length){out+="<p>"+para.map(l=>inl(linkify(l))).join("<br>")+"</p>";para=[];}};
 const cl=()=>{if(list){out+="</"+list+">";list=null;}};
 for(const raw of text.split(/\r?\n/)){const t=raw.trim();
  if(!t){fp();cl();continue;}
  let m;
  if((m=t.match(/^[-•*]\s+(.*)/))){fp();if(list!=="ul"){cl();out+="<ul>";list="ul";}out+="<li>"+inl(linkify(m[1]))+"</li>";}
  else if((m=t.match(/^(\d{1,2})[.)]\s+(.*)/))){fp();if(list!=="ol"){cl();out+=`<ol start="${m[1]}">`;list="ol";}out+="<li>"+inl(linkify(m[2]))+"</li>";}
  else{cl();para.push(t);}}
 fp();cl();return out;}
function autoOrg(s){return s.replace(/\s*(Aplicação:)/g,"\n\n**$1**").replace(/\s+(\d{1,2})\.\s+(?=[A-ZÁÉÍÓÚÂÊÔÃÕÇ])/g,"\n\n$1. ").replace(/^\s+/,"").replace(/\n{3,}/g,"\n\n");}
function applyFmt(ta,k){
 let v=ta.value,a=ta.selectionStart,b=ta.selectionEnd;
 if(k==="auto")return autoOrg(v);
 if(k==="b"||k==="u"){const w=k==="b"?"**":"__";if(a===b)return v;return v.slice(0,a)+w+v.slice(a,b)+w+v.slice(b);}
 const ls=v.lastIndexOf("\n",a-1)+1;let le=v.indexOf("\n",b);if(le<0)le=v.length;
 const seg=v.slice(ls,le).split("\n").map((l,i)=>{l=l.replace(/^(?:[-•*]|\d{1,2}[.)])\s+/,"");return k==="ul"?"- "+l:(i+1)+". "+l;}).join("\n");
 return v.slice(0,ls)+seg+v.slice(le);}
/* cronômetro e relógio */
const clock=()=>new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const elapsed=()=>V.tm?V.tm.acc+(V.tm.run?Date.now()-V.tm.start:0):0;
function fmtT(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,"0");return (h?h+":":"")+p(m)+":"+p(x);}
setInterval(()=>{const a=document.getElementById("tm"),c=document.getElementById("clk");if(c)c.textContent=clock();if(a)a.textContent=fmtT(elapsed());},1000);

/* ===================== IMPORTAR NAA ===================== */
function normalizeBible(data){
 const out=Array.from({length:66},()=>[]);let n=0;
 const put=(b,c,v,t)=>{if(b==null||b<0||b>65)return;(out[b][c-1]??=[])[v-1]=String(t).trim();n++;};
 const keyToBook=k=>isJo(k)?17:ALIAS[norm(String(k))];
 if(Array.isArray(data)&&data.length&&data[0]&&data[0].chapters){ // [{abbrev,name,chapters:[[v..]]}]
  data.forEach((bk,idx)=>{let b=keyToBook(bk.name??bk.abbrev??"");if(b===undefined)b=data.length===66?idx:undefined;
   (bk.chapters||[]).forEach((cap,ci)=>(cap||[]).forEach((t,vi)=>put(b,ci+1,vi+1,t)));});
 }else if(Array.isArray(data)&&data.length&&typeof data[0]==="object"){ // flat verses
  for(const r of data){const b=keyToBook(r.book??r.livro??r.name??r.abbrev);put(b,+(r.chapter??r.capitulo??r.cap),+(r.verse??r.versiculo??r.ver),r.text??r.texto);}
 }else if(data&&typeof data==="object"&&!Array.isArray(data)){ // {Gênesis:[[..]]} ou {Gênesis:{1:{1:".."}}}
  for(const [k,v] of Object.entries(data)){const b=keyToBook(k);if(b===undefined)continue;
   if(Array.isArray(v))v.forEach((cap,ci)=>(cap||[]).forEach((t,vi)=>put(b,ci+1,vi+1,t)));
   else for(const [c,vs] of Object.entries(v))for(const [vn,t] of Object.entries(vs))put(b,+c,+vn,t);}
 }
 return n>1000?out:null;}
function parseBibleText(txt){ // linhas "Gênesis 1:1 No princípio..."
 const out=Array.from({length:66},()=>[]);let n=0;
 for(const line of txt.split(/\r?\n/)){const m=line.match(/^\s*((?:[1-3]\s?)?[A-Za-zÀ-ú]+\.?)\s+(\d+)[:.](\d+)\s+(.+)$/);if(!m)continue;
  const b=ALIAS[norm(m[1])];if(b===undefined)continue;(out[b][+m[2]-1]??=[])[+m[3]-1]=m[4].trim();n++;}
 return n>1000?out:null;}
async function importNAA(file){
 const txt=await file.text();let bible=null;
 try{bible=normalizeBible(JSON.parse(txt));}catch(e){}
 if(!bible)bible=parseBibleText(txt);
 if(!bible){toast("Não reconheci o formato. Veja as instruções em Ajustes.");return;}
 BIBLE=bible;await DB.set("bible",bible);toast("Bíblia NAA importada!");render();}
function verses(b,c){return (BIBLE&&BIBLE[b]&&BIBLE[b][c-1])||null;}

/* ===================== UI ===================== */
const V={tm:null,tab:"sermons",view:null,filter:{facet:null,val:null,q:""},modal:null,open:{},wake:null,preachFs:null};
const $app=document.getElementById("app");
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800);}
const splitTags=s=>(s||"").split(",").map(x=>x.trim()).filter(Boolean);
const dateFmt=d=>d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short",year:"numeric"}):"";

function render(){
 document.body.classList.toggle("preach",V.view&&V.view.type==="preach");
 let h="";
 if(V.view){ if(V.view.type==="edit")h=editView(); else if(V.view.type==="read")h=readView(false); else if(V.view.type==="preach")h=readView(true);
  else if(V.view.type==="ag-edit")h=agEditView(); else if(V.view.type==="chap")h=chapView(); }
 else h=tabView();
 $app.innerHTML=h+(V.modal?modalView():"");
 if(!V.view||(V.view.type!=="preach"))$app.insertAdjacentHTML("beforeend",tabsBar());
}
function tabsBar(){const T=[["sermons","📖","Esboços"],["bible","✝","Bíblia"],["agenda","📅","Agenda"],["settings","⚙","Ajustes"]];
 return `<nav class="tabs">${T.map(t=>`<button class="${!V.view&&V.tab===t[0]?"on":""}" data-act="tab" data-t="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join("")}</nav>`;}
const topbar=(t,right="")=>`<header class="top"><span class="logo">P</span><h1>${esc(t)}</h1>${right}</header>`;

/* ---- Lista de esboços ---- */
function tabView(){
 if(V.tab==="sermons")return sermonsView();
 if(V.tab==="bible")return bibleView();
 if(V.tab==="agenda")return agendaView();

/* ===================== IMPORTAR/EXPORTAR ESBOÇOS ===================== */
function parseSermonText(txt,name){
 const lines=txt.split(/\r?\n/);let title=name.replace(/\.[^.]+$/,""),topics=[],cur=null,notes=[],started=false;
 for(const raw of lines){const l=raw.trimEnd();
  let m;
  if((m=l.match(/^#\s+(.*)/))&&!started){title=m[1];started=true;continue;}
  if((m=l.match(/^(?:##+|\d+[.)]|[IVX]+[.)])\s+(.*)/))){cur={id:uid(),title:m[1].trim(),body:""};topics.push(cur);started=true;continue;}
  if(cur)cur.body+=(cur.body?"\n":"")+l;else if(l.trim()){if(!started&&topics.length===0&&title===name.replace(/\.[^.]+$/,"")&&!notes.length&&l.length<90){title=l.trim();started=true;}else notes.push(l);}}
 topics.forEach(t=>t.body=t.body.trim());
 return {id:uid(),title,date:"",facets:{},notes:notes.join("\n"),topics,updated:Date.now()};}
async function importSermons(files){let n=0;
 for(const f of files){const txt=await f.text();
  if(/\.json$/i.test(f.name)){try{const d=JSON.parse(txt);const sm=d.sermons||(Array.isArray(d)?d:[]);
    sm.forEach(s=>{if(s&&s.title!==undefined){S.sermons.push({...s,id:uid(),updated:Date.now(),topics:(s.topics||[]).map(t=>({id:uid(),title:t.title||"",body:t.body||""}))});n++;}});
    if(d.agenda)d.agenda.forEach(a=>{S.agenda.push({...a,id:uid()});});}catch(e){}}
  else{S.sermons.push(parseSermonText(txt,f.name));n++;}}
 await save();toast(n+" esboço(s) importado(s)");render();}

document.addEventListener("change",async e=>{
 const t=e.target;
 if(t.id==="file"){const fs=[...t.files];t.value="";if(!fs.length)return;if(t.dataset.t==="naa")await importNAA(fs[0]);else await importSermons(fs);return;}
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset.act==="q"){V.filter.q=t.value;const p=t.selectionStart;render();const n=document.querySelector('[data-act="q"]');if(n){n.focus();n.setSelectionRange(p,p);}return;}
 const v=V.view;if(!v)return;
 if(t.dataset.f!==undefined)v.draft[t.dataset.f]=t.value;
 else if(t.dataset.fac)(v.draft.facets??={})[t.dataset.fac]=t.value;
 else if(t.dataset.ti!==undefined)v.draft.topics[+t.dataset.ti][t.dataset.tf]=t.value;
 else if(t.dataset.ag)v.draft[t.dataset.ag]=t.value;
});

 try{await DB.open();const d=await DB.get("data");if(d)S={...S,...d};BIBLE=(await DB.get("bible"))||null;}catch(e){toast("Armazenamento indisponível neste navegador");}
 render();
})();
</script>
